# EN→JA trainer/特殊能量 名字级词表（task 036，PRD v1.20）
#
# 用途：trainer/特殊能量无 dexId 链（task 024 结论），name_ja 由本词表人工种子填充
# （`map-ja-trainer` / `mapping/ja_trainer.py`）。
#
# 口径：
# - 主键 = EN 卡名（mik 英文桥 name_en，逐字）；`cn` 仅在 name_en 一对多 CN 名时
#   消歧必填（实测 2 组：Counter Gain——胜利勋章桥字段疑点未裁决只填反击增幅器；
#   Fire Memory——CSM1cC-131 战斗存储碟 EN 桥误标，正身 Fighting Memory，
#   2026-08-15 用户核官方卡表确认 131/132 两个不同名，两条 cn 消歧并入 gap 清单）。
# - 校验锚（不猜）：ja 必须 ∈ TCGdex JA 名表（raw tcgdex/ja-cards.json）；
#   唯一豁免 = `tcgdex_gap: true`（官方实有卡、TCGdex JA 2026-08-14 快照缺席，
#   现存 2 名：いれかえカート / エール団の応援，均 2026-08-15 用户官方卡查
#   核销拼写确认；初版另 4 名核销中查明正体并锚定：エネルギーサーチ→エネルギー転送、
#   エネルギーサーチプロ→エネルギー転送PRO、パワーグラス→力の砂時計、
#   存储碟家族 ファイト/ファイヤー/ウォーター/サイキックメモリ）。
# - 名字级语义：同名全印刷同 name_ja（与宝可梦一致）；ACE SPEC 卡词表存本体名
#   （官方 deck 页的 `(ACE SPEC)` 后缀由 normalize_ja_deck_name 剥离，task 037 复用）。
# - 未覆盖名一律入 question 清单，不猜。词表可追加（开放词表惯例）。
#
# 覆盖范围（2026-08-14 首版）：G/H/I 当前环境 distinct 名主体 + 高置信度旧标竞技名。

