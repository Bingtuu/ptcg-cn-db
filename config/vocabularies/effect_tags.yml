# 效果粗粒度标签词表（task 038，PRD v1.22 §6.4；spec 2026-08-16 定稿）
#
# 用途：cards.effect_tags 标注的唯一事实源——`tag-effects-scan`（task 038 命中率评测）
# 与 `tag-effects`（task 039 落库）共用；代码零内置词。
#
# 口径：
# - 文本源 = text_raw（trainer/energy）/ attacks[].effect_text / abilities[].effect_text
#   （或旧字段 text），逐字匹配，绝不做术语规范化；新旧措辞（灼伤/烧伤等）在 patterns
#   内并列解决。
# - 每条 = tag/cn/patterns（正则列表，任一命中即中）+ 可选 scope/note。
#   scope：trainer=仅训练家卡面文本；energy=仅能量卡面文本；pokemon=仅招式/特性；
#   缺省 = 全段适用。
# - 多标签是常态（一卡多意图）；机制 flag 落 detail.flags，不占意图标签数，
#   只标记"此卡含条件/限次/硬币"，不解析条件内容（规则引擎职责）。
# - 零命中文本一律浮出 zero_hits（不猜），人工归类三出口：旧标签新措辞 → 追加
#   pattern（零代码）/ 新意图类别 → 追加标签条目（零代码）/ 无需打标 → 核销理由落报告。
#
# 实证基线（v1 首版）：patterns 以 .scratch/phase3-gap-scan.py v2 模式为底，按
# CSV10C/CSV9.5C/CSV9C 三套装 603 distinct 文本查漏结论修正（spec「词表 v3」节）：
# damage_boost 去掉裸 ×2（×20/×200 变量伤害误命中）；spread 去掉裸 造成\d+伤害
# （固定伤害由 attacks 结构承载）；discard_recover 距离 18→30 且含放于备战区；
# switch 补招式自换无"自己"主语变体；once_per_turn 补真实措辞"可使用1次/有1次机会"。

tags:
  - tag: draw
    cn: 抽牌
    patterns:
      - 抽(?:取)?\d*张
      - 抽(?:到|直至|直到)
      - 抽卡
      - 直到自己的?手牌(?:数量)?变为\d+张
      - 抽取与.{0,24}相同数量的卡牌
    note: 含"补至 N 张"（梦幻ex「再起动」/火箭队的雅典娜「直到手牌变为N张为止」）、
      计数抽（觉醒战鼓/奇树「抽取与…相同数量的卡牌」）、双方重抽。
  - tag: search
    cn: 检索牌库
    patterns:
      - 选择.{0,8}牌库
      - 牌库中.{0,6}选择
      - 从自己?牌库(?!上方|下方)
      - 将自己牌库中
      - 寻找
      - 查看自己?牌库
      - 牌库下方?\d+张
    note: 含入手牌与直接放备战区/直接进化登场（巢穴球类）。"从自己牌库上/下方抽取N张"
      是抽牌不是检索，用负向断言排除（虫甲圣ex「颠倒抽取」反例）。
  - tag: mill
    cn: 牌库削减
    patterns:
      - 自己?牌库.{0,10}放于弃牌区
      - 牌库上方?\d+张卡牌?，?(全部)?放于弃牌区
      - 对手牌库.{0,30}放于弃牌区
    note: 自堆（迷失轴引擎）+ 削对手牌库（腕力「敲山」/铁蚁ex「突然切削」/
      三海地鼠「掘海隧道」硬币计数削/鲶鱼王「暴乱摇晃」长距计数削）。
  - tag: discard_recover
    cn: 弃牌区回收
    patterns:
      - 弃牌区.{0,30}(加入手牌|放回|返回|回手牌|放于备战区|放于场上)
      - 弃牌区中的.{0,24}合计最多\d+张.{0,14}加入手牌
    note: 回手牌/回牌库/直接放备战区（夜巡灵「渡魂」）；能量从弃牌区附着归 energy_accel。
      「宝可梦和基本能量合计最多N张…加入手牌」长距变体（莉普/水莲的照顾/钓竿MAX）
      单列模式，避免加宽主模式误跨子句（青木的本领反例）。
  - tag: hand_disrupt
    cn: 手牌博弈
    patterns:
      - 手牌.{0,10}(丢|弃|放回|重洗|公开|查看)
      - 对手.{0,4}手牌
    note: 查看/公开/丢弃/洗回（含双方洗抽，奇树类）。
  - tag: damage_boost
    cn: 增伤
    patterns:
      - 伤害[「"']?\+
      - 伤害增加
      - 造成的?伤害.{0,4}[+增]
      - 追加造成\d+点?伤害
      - 倍增
      - 变为2倍
    note: 「伤害+30」类（讲究腰带头带类高频）+ 条件追加固定伤害「如果…则追加造成N伤害」
      （水伊布「斗志潮漩」类高频）；计数型 ×N 变量伤害由 attacks.damage_modifier
      承载不打标（追加造成正面次数×N/张数×N 因非数字开头不命中）。
  - tag: spread
    cn: 铺伤
    patterns:
      - (?<!被)放置(?:最多)?\d*个?伤害指示物
      - 伤害指示物.{0,12}放置于
      - 转放于对手
      - 也造成\d+伤害
      - 对.{0,8}备战宝可梦.{0,6}造成
    note: 放置伤害指示物/备战区溅射；主目标固定伤害不打标。原裸「伤害指示物」被
      计数引用型（…伤害指示物数量×N伤害）与条件引用型（放置有伤害指示物的话）误命中，
      收窄为放置动作型（雪妖女「冻结帷幕」/来悲粗茶ex「再煮悲茶」/反击类
      「伤害指示物放置于使用了招式的宝可梦身上」/指示物转给对手 火箭队的果然翁
      「火箭镜面」）；己方间转放（呆壳兽「古怪行为」）与引用型不打 spread。
  - tag: heal
    cn: 回复
    patterns:
      - 回复
      - 恢复
    note: 含特殊状态恢复。
  - tag: protection
    cn: 防御修正
    patterns:
      - 不.{0,2}会受到
      - 不受到
      - 伤害.{0,3}[-减]
      - 减轻
      - 免疫
      - 不会陷入
      - 弱点.{0,4}消除
      - 抵抗力
      - 不会【?昏厥
      - 被放置伤害指示物
    note: 减伤/免伤（含「不受到」无"会"变体）/效果免疫/特殊状态免疫/免昏厥（顽强之心）/
      弱点抗性消除/免指示物（基拉祈「恒星之幕」唯一实证：被放置伤害指示物）。
  - tag: status
    cn: 特殊状态
    patterns:
      - 中毒
      - 灼伤
      - 烧伤
      - 麻痹
      - 睡眠
      - 混乱
      - 特殊状态
    note: 赋予中毒/灼伤/麻痹/睡眠/混乱。
  - tag: energy_accel
    cn: 能量加速
    patterns:
      - 能量.{0,12}附着
      - 附着\d?张.{0,14}能量
      - 填能
    note: 额外附着（来源不限：牌库/弃牌区/手牌）。原「附着.{0,10}能量」被
      「身上附着的N个能量」（已有能量的属格描述，多为自付代价/条件）大量误命中，
      收窄为动作型「附着N张…能量」（重泥挽马「贮存泥巴」/古玉鱼ex「火焰巨浪」）；
      正向序「…能量，附着于…」由首条模式承载。
  - tag: energy_move
    cn: 能量转移
    patterns:
      - 转附
      - 移动.{0,4}能量
      - 能量.{0,4}移动
    note: 场上宝可梦间转附（不增量）。
  - tag: energy_disrupt
    cn: 能量干扰
    patterns:
      - 对手.{0,14}能量.{0,6}(丢|弃|放回|移除)
      - (对手|对方|那只宝可梦|使用了招式的宝可梦).{0,24}能量.{0,4}放于弃牌区
      - 能量.{0,4}放回对手
    note: 拆/回对手能量；随道具/竞技场一起拆的（吹风机类）归 removal。原裸模式
      「能量.{0,4}放于弃牌区」被自付代价型弃置（将这只宝可梦身上附着的能量放于弃牌区）
      大量误命中，收窄为对手锚定型（泥巴鱼「劈啪麻痹」那只宝可梦 /
      毛崖蟹「反击巨钳」使用了招式的宝可梦变体保留）。
  - tag: gust
    cn: 强制换位
    patterns:
      - 对手.{0,6}(备战|宝可梦).{0,6}(互换|交换)
      - 选择对手的?\d?只备战宝可梦，?将其与战斗
      - 对手.{0,26}将其与战斗宝可梦互换
      - 与对手的?战斗宝可梦互换
    note: 老大的指令类。长间隔变体「选择对手备战区中的1只…宝可梦，将其与战斗宝可梦
      互换」（反击捕捉器/玛狃拉「突袭狩猎」/安瓢虫「烁星花纹」）；「选择自己备战区…
      将其与战斗宝可梦互换」（桃歹郎ex「支配锁链」）是己方换位，以对手锚定排除。
  - tag: switch
    cn: 己方换位
    patterns:
      - 自己.{0,4}(战斗|备战).{0,4}(互换|交换)
      - 自己的战斗宝可梦与备战宝可梦互换
      - 将这只宝可梦与战斗宝可梦互换
      - 处于战斗场上的这只宝可梦，?与备战宝可梦互换
      - 替换
      - 换入
      - 换出
      - 将这只宝可梦与备战
    note: 含招式自换无"自己"主语变体（土龙弟弟「交替」/锹农炮虫「伏特替换」）、
      宝可梦交替/冲浪手型「自己的战斗宝可梦与备战宝可梦互换」（对手的由 gust 锚定
      排除）、备战自荐「将这只宝可梦与战斗宝可梦互换」（魔幻假面喵「表演时间」）、
      狙射树枭ex「无拘无束」双向长句。
  - tag: bounce
    cn: 回手回库
    patterns:
      - 放回?手牌
      - 返回手牌
      - 回到手牌
      - 放回?牌库
      - 放回自己的牌库
      - 放回各自的牌库
      - 返回牌库
      - 回到牌库
    note: 己方宝可梦回手/回库。「放回自己的牌库」（赛富豪「冲浪回转」/凯西「传送者」）
      与「各放回各自的牌库」（巴大蝶「去去飞行」双方回库）为代词插入变体。
  - tag: removal
    cn: 拆除场上物
    patterns:
      - (对手|场上).{0,20}「?(竞技场|宝可梦道具)」?.{0,24}放于弃牌区
      - 将场上的竞技场放于弃牌区
    note: 拆竞技场/宝可梦道具（切割利刃/百万吨吹风机/古剑豹「埋入雪中」）；能量拆除归 energy_disrupt；自付代价型弃置（灰尘山「抛弃」）非 removal——模式以"对手/场上"锚定排除。
  - tag: ko
    cn: 直接昏厥
    patterns:
      - 令.{0,12}【?昏厥
      - 将受到.{0,24}放于弃牌区
      - 受到这个招式影响的宝可梦会【?昏厥
      - 将对手的?战斗宝可梦.{0,24}放于弃牌区
    note: 即死（同命战斗）/延迟弃置（侵蚀污泥）/倒计时昏厥（八爪武师「缓缓攻克」/
      凯罗斯「缓慢咀嚼」）/直接弃置对手战斗宝可梦（火箭队的火焰鸟ex「邪恶燃烧」/
      爆音怪「骤然高吼」）；稀少但语义独立。
  - tag: copy
    cn: 招式复制
    patterns:
      - 作为这个招式使用
    note: 选择…所拥有的1个招式作为这个招式使用（索罗亚克ex 暗夜王牌/谜拟丘）。
  - tag: lock
    cn: 无效化禁止
    patterns:
      - 无法
      - 不能
      - 特性.{0,20}全部消除
      - 的效果，全部消除
      - 无效
      - 不受.{0,10}效果
      - 禁止
      - 不计算.{0,16}效果
    note: 特性/道具消除（火箭队的监视塔/振翼发「暗夜振翼」/阻碍之塔「…的效果，
      全部消除」）、无法使用招式、无法撤退、贯穿"不计算附加效果"（波荡水ex/沉重猛击）；
      与 protection 的界线：protect 己方，lock 消除机制。原裸「消除」被撤退费/能耗/弱点
      消除（modifier/protection 语义）大量误命中，收窄为特性/效果锚定。
  - tag: modifier
    cn: 面板规则修正
    patterns:
      - 最大HP
      - 撤退.{0,6}(减少|增加|消除)
      - 所需.{0,4}能量.{0,6}(减少|增加|消除|变为)
      - 仅需.{0,10}能量便可使用
      - 奖赏卡.{0,8}(增加|减少|多拿|少拿|查看|互换|翻到正面)
      - 拿取\d?张奖赏卡
      - 备战区.{0,6}(变|增)
      - 备战区的宝可梦数量.{0,6}变
      - 最多放\d?张「宝可梦道具」
      - 视作\d+个
      - 弱点
      - 抗性
      - 属性变为
    note: 最大HP±/撤退费±/能耗±（含「变为1个【X】能量」玛力露丽「闪亮肥皂泡」/
      「仅需N个能量便可使用」轻身鳕「轻盈螺旋」）/奖赏卡拿取增减·查看·互换·翻面
      （克雷色利亚「新月净化」；多拿取类 白蕾雅/蝶结萌虻「冗余花粉」）/备战容量
      （晶光花ex「尘埃场地」）/道具容量（普隆隆姆ex「调试」）/供能视作（火箭队能量类）
      /属性变更（狠辣椒ex/铁辙迹）。
  - tag: evolution
    cn: 进化支援
    patterns:
      - 进化
      - 退化
    note: 直接进化/跳阶段/退化（退化对手 = 干扰向，同标签）。
  - tag: special_behavior
    cn: 特殊行为
    patterns:
      - 作为.{0,12}宝可梦.{0,4}放于场上
      - 学习器
      - 这张卡牌上的招式
      - 才能被放于场上
    note: 谜之化石类"训练家卡当宝可梦"/招式学习器 body（卡名带「学习器」或 body 措辞
      「可以使用这张卡牌上的招式」——招式学习器 临危一击/萤石等 text_raw 不含"学习器"
      字样，由 body 措辞承载）/变身出场限制（海豚侠ex「全能之魂」）；人工名单驱动。

flags:
  - flag: coin_flip
    cn: 硬币随机
    patterns:
      - 硬币
    note: 含硬币随机（AI 模拟 RNG 建模用）。
  - flag: once_per_turn
    cn: 回合限次
    patterns:
      - 回合.{0,6}(1次|一次)
      - 可以使用\d?次
      - 可使用\d?次
      - 有\d?次机会
    note: 真实措辞「每次在自己的回合有1次机会」「可以使用1次」「可使用1次」。
  - flag: conditional
    cn: 条件触发
    patterns:
      - 如果
      - 只有在
      - 只有当
      - 若
      - 时才
      - 状态下
      - 当.{0,12}时
    note: 只标记"此卡含条件"（奖赏卡比较/昏厥触发/先后攻限制等），不解析条件内容。
